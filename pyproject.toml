[project]
name = "ola"
version = "0.11.0"
description = "Outer Loop of Agents"
requires-python = ">=3.12"
# The OpenHands backend (`oh`) shells out to the standalone `openhands` CLI
# (installed separately via `uv tool install openhands`), so the SDK is no
# longer a library dependency — that subprocess isolation is the whole point of
# the redesign (it sidesteps the SDK's in-process LLM serialization lock).
dependencies = [
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0",
]

# The one sbx release this ola release supports. ola.sh's
# _ola_check_sbx_version refuses an older sbx and warns on a newer one; the
# release notes for every ola version state it (see the ola-release skill).
# Bump it only after re-verifying the sbx skill's contract on that release.
[tool.ola]
sbx-version = "0.51.0"

[project.scripts]
ola = "ola.cli:main"
ola-top = "ola.monitor.cli:main"
ola-dashboard = "ola.dashboard.cli:main"

[dependency-groups]
dev = ["pytest>=9.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ola"]

[tool.pytest.ini_options]
testpaths = ["tests"]
